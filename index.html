<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank hoilday Website</title>
    <link rel="stylesheet" href="styles.css" >
</head>
<body>
    <h1>UK Bank Hoildays</h1>
    
    <div id = dropDownBox>
        <label for = 'countries'>Choose a country</label>
        <select name="countries" id="countries">
        <option value="" disabled selected>Pick a country</option>
        <option value="northern-ireland">Northern Ireland</option>
        <option value="england-and-wales">England and Wales</option>
        <option value="scotland">Scotland</option>


    </select>
    </div>
    <div id = datesDDB>
        <label for = 'dates'>Upcoming or past </label>
        <select name="dates" id="dates">
        <option value="upcoming">Upcoming</option>
        <option value="past">Past</option>
        
    </select>
    </div>
    <div id="calendar">
        


    </div>
    <div id = "upcomingBankHol">
        <h2>Upcoming bank holiday</h2>
        <p id="upcomingResult"></p>
    </div>

    <div id = "pastBankHol">
        <h2>Previous bank holiday</h2>
        <p id="pastResult"></p>
    </div>

<script src="script.js"></script>
</body>
</html>
